  - name: "auth"
  - name: "auth_public"
  - name: "common"
  - name: "common_ws"
  - name: "dashboard"
  - name: "dashboard_personal"
  - name: "department"
  - name: "export_personal"
  - name: "file"
  - name: "health"
  - name: "log"
  - name: "login"
