components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "通过 Authorization: Bearer <token> 携带访问令牌"
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: "通过 HttpOnly refresh_token Cookie 完成会话刷新或退出"
    WebSocketTicket:
      type: apiKey
      in: query
      name: ticket
      description: "通过一次性 ticket 建立 WebSocket 连接"
  schemas:
    Response:
      type: object
      description: "统一响应包络"
      required:
        - code
        - msg
        - data
        - cost
        - request_id
      properties:
        code:
          type: integer
          description: "业务状态码（0 表示成功）"
          example: 0
        msg:
          type: string
          description: "提示信息"
          example: "success"
        data:
          description: "业务数据载荷"
          nullable: true
        cost:
          type: string
          description: "请求处理耗时"
          example: "3.2ms"
        request_id:
          type: string
          description: "请求唯一标识"
          example: "req_20260423_0001"
