name: Go

on:
  push:
    branches: [ master, x_l_admin ]
  pull_request:
    branches: [ master, x_l_admin ]

jobs:

  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: go_layout_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      matrix:
        go-version: [ '1.27.x' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Display Go version
        run: go version

      - name: Build
        run: go build -v ./...

      - name: Dependency integrity and reachable vulnerabilities
        run: |
          go mod verify
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Unit tests
        run: go test $(go list ./... | grep -Ev '/tests(/|$)')

      - name: Go vet
        run: |
          packages="$(go list ./... | grep -Ev '/tests(/|$)')"
          go vet $packages

      - name: Verify generated OpenAPI is current
        run: |
          cp ./config/config.yaml.example /tmp/go-layout-openapi-config.yaml
          go run . -c /tmp/go-layout-openapi-config.yaml command gen-openapi
          git diff --exit-code -- docs/openapi.yaml

      - name: Verify generated error codes are current
        run: |
          cp ./config/config.yaml.example /tmp/go-layout-error-codes-config.yaml
          go run . -c /tmp/go-layout-error-codes-config.yaml command gen-error-codes
          git diff --exit-code -- docs/error_codes.json docs/error_codes.ts

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Staticcheck targeted packages
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./internal/service/role ./internal/service/sys_dict ./internal/validator/form ./tests/...

      - name: Prepare MySQL integration config
        run: |
          cat > config.yaml <<'YAML'
          app:
            app_env: local
            debug: true
            language: zh_CN
          jwt:
            ttl: 7200
            refresh_ttl: 3600
            secret_key: ci-secret-key-for-go-layout-tests
          mysql:
            enable: true
            host: 127.0.0.1
            port: 3306
            database: go_layout_test
            username: root
            password: root1234
            charset: utf8mb4
            table_prefix: ""
            max_idle_conns: 10
            max_open_conns: 100
            max_lifetime: 3600s
            print_sql: false
          redis:
            enable: false
          queue:
            enable: false
          logger:
            output: stderr
          storage:
            active_driver: local
          YAML

      - name: Initialize MySQL schema and seed data
        run: go run main.go -c ./config.yaml command init-system -y --backup-confirmed --confirm-database go_layout_test
        env:
          GO_LAYOUT_MIGRATIONS_PATH: ${{ github.workspace }}/data/migrations

      - name: Full test coverage
        run: make test-coverage
