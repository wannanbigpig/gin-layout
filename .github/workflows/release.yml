name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: go_layout_release_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' internal/global/common.go)"
          test -n "$source_version"
          test "$tag_version" = "$source_version"
          go run . command release-check --tag "$GITHUB_REF_NAME"
          grep -Fq "## [${tag_version}]" CHANGELOG.md
          awk -v marker="## [${tag_version}]" '
            index($0, marker) == 1 { found=1 }
            found && /^## \[/ && index($0, marker) != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            printf '\n## Compatibility, upgrade, and rollback\n\n'
            cat docs/COMPATIBILITY.md
          } >> release-notes.md
          guide="docs/upgrades/${tag_version}.md"
          cat "$guide" >> release-notes.md
      - name: Dependency integrity and reachable vulnerabilities
        run: |
          go mod verify
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Verify
        shell: bash
        env:
          JWT_SECRET_KEY: ci-documentation-jwt-key-not-for-deployment
          CREDENTIAL_ENCRYPTION_KEY: ci-documentation-encryption-key-not-for-deployment
        run: |
          set -euo pipefail
          packages="$(go list ./... | grep -Ev '/tests(/|$)')"
          go test $packages
          go vet $packages
          cp ./config/config.yaml.example /tmp/go-layout-release-config.yaml
          go run . -c /tmp/go-layout-release-config.yaml command gen-openapi
          git diff --exit-code -- docs/openapi.yaml
          go run . -c /tmp/go-layout-release-config.yaml command gen-error-codes
          git diff --exit-code -- docs/error_codes.json docs/error_codes.ts
          node --test scripts/api-documentation.test.mjs
          node scripts/generate-api-documentation.mjs --check
          go run . -c /tmp/go-layout-release-config.yaml command migrate check --path ./data/migrations
          cat > config.test.yaml <<'YAML'
          app:
            app_env: local
            debug: true
            language: zh_CN
            rate_limit_enabled: false
            login_rate_limit_enabled: false
          jwt:
            ttl: 7200
            refresh_ttl: 3600
            secret_key: release-ci-secret-key-for-tests
          security:
            credential_encryption_key: release-ci-credential-key-for-tests-0123456789
          mysql:
            enable: true
            host: 127.0.0.1
            port: 3306
            database: go_layout_release_test
            username: root
            password: root1234
            charset: utf8mb4
            table_prefix: ""
            max_idle_conns: 10
            max_open_conns: 100
            max_lifetime: 3600s
            print_sql: false
          redis:
            enable: false
          queue:
            enable: false
          logger:
            output: stderr
          storage:
            active_driver: local
          YAML
          GO_LAYOUT_MIGRATIONS_PATH="${GITHUB_WORKSPACE}/data/migrations" go run . -c ./config.test.yaml command init-system -y --backup-confirmed --confirm-database go_layout_release_test
          GOTEST_CONFIG=config.test.yaml go test ./tests/...
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          module_path="$(awk '$1 == "module" {print $2; exit}' go.mod)"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p dist/stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            package_name="go-layout_${version}_${os}_${arch}"
            package_dir="dist/stage/${package_name}"
            mkdir -p "${package_dir}/data/migrations" "${package_dir}/docs"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X ${module_path}/internal/global.Version=${version} -X ${module_path}/internal/global.BuildCommit=${GITHUB_SHA} -X ${module_path}/internal/global.BuildTime=${built_at} -X ${module_path}/internal/global.BuildDirty=false" -o "${package_dir}/go-layout${ext}" .
            cp config/config.yaml.example "${package_dir}/config.yaml.example"
            cp rbac_model.conf README.md README.en.md CHANGELOG.md LICENSE "${package_dir}/"
            cp docs/COMPATIBILITY.md docs/release.json docs/openapi.yaml docs/error_codes.json docs/error_codes.ts docs/api-documentation.json "${package_dir}/docs/"
            cp -R docs/upgrades "${package_dir}/docs/"
            printf '{"version":"%s","commit":"%s","builtAt":"%s","dirty":"false"}\n' "$version" "$GITHUB_SHA" "$built_at" > "${package_dir}/build-info.json"
            cp -R data/migrations/. "${package_dir}/data/migrations/"
            if [ "$os" = windows ]; then
              (cd dist/stage && zip -rq "../${package_name}.zip" "${package_name}")
            else
              tar -czf "dist/${package_name}.tar.gz" -C dist/stage "${package_name}"
            fi
          done
          rm -rf dist/stage
      - name: Verify release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/verify
          for archive in dist/go-layout_*.tar.gz dist/go-layout_*.zip; do
            rm -rf dist/verify/*
            filename="$(basename "$archive")"
            package_name="${filename%.tar.gz}"
            package_name="${package_name%.zip}"
            if [[ "$archive" == *.zip ]]; then
              unzip -q "$archive" -d dist/verify
              binary_name="go-layout.exe"
            else
              tar -xzf "$archive" -C dist/verify
              binary_name="go-layout"
            fi
            package_dir="dist/verify/${package_name}"
            test -f "${package_dir}/${binary_name}"
            test -f "${package_dir}/config.yaml.example"
            test -f "${package_dir}/rbac_model.conf"
            test -f "${package_dir}/README.md"
            test -f "${package_dir}/README.en.md"
            test -f "${package_dir}/CHANGELOG.md"
            test -f "${package_dir}/docs/COMPATIBILITY.md"
            test -f "${package_dir}/docs/openapi.yaml"
            test -f "${package_dir}/docs/release.json"
            test -f "${package_dir}/docs/api-documentation.json"
            test -f "${package_dir}/docs/upgrades/${GITHUB_REF_NAME#v}.md"
            test -f "${package_dir}/build-info.json"
            test -f "${package_dir}/LICENSE"
            test -n "$(find "${package_dir}/data/migrations" -type f -print -quit)"
            if [ "$package_name" = "go-layout_${GITHUB_REF_NAME#v}_linux_amd64" ]; then
              "${package_dir}/go-layout" -h >/dev/null
              test "$("${package_dir}/go-layout" version)" = "${GITHUB_REF_NAME#v}"
            fi
          done
          rm -rf dist/verify
          cp docs/openapi.yaml docs/error_codes.json docs/release.json docs/api-documentation.json dist/
          sha256sum dist/*.tar.gz dist/*.zip dist/*.yaml dist/*.json > dist/checksums.txt
      - name: Reject an existing release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: context.ref.replace('refs/tags/', '') });
              throw new Error('A release already exists for this tag; do not mix artifacts from different builds.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*
